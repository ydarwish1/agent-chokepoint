# Source: agent-chokepoint/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chokepoint-agent-chokepoint
  labels:
    helm.sh/chart: agent-chokepoint-0.1.0
    app.kubernetes.io/name: agent-chokepoint
    app.kubernetes.io/instance: chokepoint
    app.kubernetes.io/version: "0.0.1.dev0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-chokepoint
      app.kubernetes.io/instance: chokepoint
  template:
    metadata:
      annotations:
        # The proxy loads the policy ONCE at startup. Without this, editing the
        # policy ConfigMap would change the mounted file and leave the running
        # gateway enforcing the old rules. This rolls the pod on any change.
        checksum/policy: 875832d3c7b716f87a12b70079286ad2d8a5dbe1cfc7cd45dff7b61a7403cfa8
      labels:
        app.kubernetes.io/name: agent-chokepoint
        app.kubernetes.io/instance: chokepoint
    spec:
      serviceAccountName: chokepoint-agent-chokepoint
      # Half of the minimal-RBAC answer; see templates/serviceaccount.yaml.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "agent-chokepoint:phase3"
          imagePullPolicy: IfNotPresent
          # DELIBERATELY NO `stdin: true`. It was required while the container's
          # main process WAS the proxy: with stdin at /dev/null, stdio_server()
          # read EOF immediately and the process exited -> CrashLoopBackOff. The
          # main process is now the DRIVER, which is the client: it spawns the
          # proxy and owns that child's stdin as its parent, and it never reads
          # the container's own stdin. Holding a stream open for a consumer that
          # no longer exists would be an unexamined knob hiding what the pod
          # actually needs. Checked before removing: nothing else depends on it
          # — deploy/demo/cluster_acceptance.py reaches the pod with
          # `kubectl exec -i`, which pipes into a NEW process and needs no
          # pod-spec stdin (that is `kubectl attach`), and no other file in the
          # repo references it.
          tty: false
          command:
            - "/usr/local/bin/python3"
            - "/app/deploy/demo/gateway_driver.py"
            - "--policy"
            - "/etc/chokepoint/policy.yaml"
            - "--state-dir"
            - "/sandbox"
            - "--"
            - "/usr/local/bin/python3"
            - "/app/proxy/demo/upstream_server.py"
            - "--sandbox"
            - "/sandbox"
          env:
            - name: PATH
              value: "/usr/local/bin:/usr/bin:/bin"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # LIVENESS: is the driver still alive AND still working? It bumps
          # /sandbox/heartbeat every 10s; this probe reads
          # that file's MTIME and requires it to be FRESH. It does not merely
          # test that the file exists. Existence alone is worthless: the file
          # outlives the process that wrote it, so a dead or wedged driver would
          # look healthy forever and the pod would sit there enforcing nothing.
          # That is precisely the failure this change exists to prevent.
          # os.stat() raises when the file is absent, so "never started" fails
          # the same check as "stopped beating" — one probe covers both.
          #
          # 40s = 4 missed bumps: wide enough that one late bump under the 500m
          # CPU limit is not a restart, narrow enough that a dead driver is
          # caught inside ~70s (first stale read >=40s after the last bump, then
          # failureThreshold 3 x periodSeconds 10). initialDelaySeconds 60 is
          # the startup budget, and it is load-bearing: the driver beats only
          # once it reaches its holding phase, which is AFTER the acceptance
          # legs, so this delay must cover image start, interpreter start, the
          # driver spawning the proxy which spawns the upstream, AND the legs
          # themselves — a restart mid-acceptance would be self-inflicted. The
          # contract this sets for the driver: FIRST heartbeat within 60s of
          # container start; the kubelet restarts at ~90s (60 + 3 x 10).
          livenessProbe:
            exec:
              command:
                - "/usr/local/bin/python3"
                - -c
                - >-
                  import os, sys, time;
                  sys.exit(0 if time.time() - os.stat("/sandbox/heartbeat").st_mtime < 40 else 1)
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # READINESS: did a REAL tool call cross the DEPLOYED proxy and come
          # back with the verdict the policy owes it? The driver creates
          # /sandbox/ready ONLY when every acceptance leg
          # passed, so Ready now means enforcement was exercised and was right.
          # Before, Ready meant the modules imported and the policy parsed —
          # true of a pod that had never judged a single call.
          #
          # No value here can make this lax: the probe reads an artifact that
          # only a fully passing run produces. Kubernetes never expires a
          # readiness probe that has not yet succeeded — the pod simply stays
          # NotReady and keeps probing — so a broken driver cannot age into
          # Ready; it is the rollout's `--wait` timeout, not failureThreshold,
          # that bounds the wait. failureThreshold governs the other direction
          # (a pod that WAS Ready), where 3 x 5s de-registers promptly.
          # initialDelaySeconds 10 only avoids probing before any run could
          # plausibly have finished.
          readinessProbe:
            exec:
              command:
                - "/usr/local/bin/python3"
                - -c
                - >-
                  import os, sys;
                  sys.exit(0 if os.path.exists("/sandbox/ready") else 1)
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
          volumeMounts:
            - name: policy
              mountPath: "/etc/chokepoint"
              readOnly: true
            # Also the driver's --state-dir: acceptance.json, `ready` and
            # `heartbeat` are written here, which is why both probes read it.
            - name: sandbox
              mountPath: "/sandbox"
            # readOnlyRootFilesystem: true leaves no writable /tmp. The demo
            # drivers this deployment runs use tempfile.TemporaryDirectory
            # (proxy/demo/run_demo.py:117, pep/demo/two_doors_paths.py:799,
            # hooks/demo/side_by_side.py:920), which fails without one.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy
          configMap:
            name: chokepoint-agent-chokepoint-policy
            defaultMode: 0444
        - name: sandbox
          emptyDir: {}
        - name: tmp
          emptyDir: {}

