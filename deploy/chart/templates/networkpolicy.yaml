{{- if .Values.networkPolicy.enabled }}
{{/*
Default-deny BOTH directions. There is no `ingress:` key and no `egress:` key
below, and that is the whole object: naming a policyType with no rules for it
denies all traffic of that type.

The egress allow-list is EMPTY because the workload genuinely needs no network,
not as a shortcut. Verified: no socket/bind/listen/connect anywhere in
proxy|engine|policy|pep|hooks — the sole network-shaped import is
urllib.parse.urlsplit (string parsing) at engine/predicates.py:41. The demo
upstream needs none either: fetch_url is simulated and run_command is recorded,
never executed (proxy/demo/upstream_server.py:33).

The podSelector renders from the SAME helper as the Deployment's selector and
pod template labels, so they cannot drift. This matters more than it looks: a
podSelector that matches nothing produces a NetworkPolicy object that exists,
lists cleanly in `kubectl get networkpolicy`, and enforces nothing.

Enforcement is a property of the CNI, not of this file. Measured: on kindnet
this exact shape had ZERO effect. Only claim it works on the Calico cluster,
and only with values-no-networkpolicy.yaml as the control leg.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-chokepoint.fullname" . }}
  labels:
    {{- include "agent-chokepoint.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-chokepoint.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
