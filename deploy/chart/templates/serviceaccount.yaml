{{/*
MINIMAL RBAC. Read this before adding a Role.

There is deliberately NO Role and NO RoleBinding in this chart. The gateway
calls no Kubernetes API: it reads a policy file, speaks MCP over stdio, and
spawns one child process. A Role granting zero verbs would be theatre — it
would appear in `kubectl get role`, satisfy a checklist, and confer exactly
what the absence of a Role already confers.

The honest minimum is BOTH halves together:
  1. no Role and no RoleBinding bound to this ServiceAccount, and
  2. automountServiceAccountToken: false, on the ServiceAccount AND on the pod
     spec, so no token is projected into the container at all.

Half 2 is the load-bearing one. Without it the pod still carries a token with
the default `system:serviceaccounts` permissions and can reach the API server.
Verify with `kubectl auth can-i --list --as=system:serviceaccount:<ns>:<sa>`
and by confirming /var/run/secrets/kubernetes.io is absent in the container.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-chokepoint.serviceAccountName" . }}
  labels:
    {{- include "agent-chokepoint.labels" . | nindent 4 }}
automountServiceAccountToken: false
